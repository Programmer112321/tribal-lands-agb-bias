# Paths used by every script. Edit input_dir (and, if needed, single entries) for your machine.
# Relative input paths are read under input_dir; absolute paths are used as given.
# output_dir is relative to the repository root unless absolute.

input_dir: "D:/cdj/chapter1_2_3/input"
output_dir: "output"

inputs:
  # FIA database, SQLite, FIADB v9.3 (whole U.S.; https://research.fs.usda.gov/products/dataandtools/fia-datamart)
  fiadb: "FIA_ENTIRE_2025/SQLite_FIADB_ENTIRE.db"
  # FIA 64,000-ha hexagon grid (Menlove & Healey, 2020); only the FID and geometry are used
  fia_hexagons: "boundary/FIA_polygon/ref_AGB_FIA_hex.shp"
  # U.S. Census Bureau 2024 TIGER/Line American Indian/Alaska Native/Native Hawaiian Areas
  tribal_lands: "boundary/tribe_boundary/tl_2024_us_aiannh.shp"
  # USDA Forest Service ECOMAP ecological provinces (2007)
  eco_provinces: "boundary/USFS_ecological_subregions_2007/province2007.shp"
  # NLCD Tree Canopy Cover v2025-6, CONUS, WGS84
  nlcd_tcc_2021: "stand_structure/treecover_NLCD/nlcd_tcc_conus_wgs84_v2025-6_20210101_20211231.tif"
  nlcd_tcc_2020: "stand_structure/treecover_NLCD/nlcd_tcc_conus_wgs84_v2025-6_20200101_20201231.tif"
  # GEDI L4B gridded AGB v2.1, 1 km: mean (MU) and standard error (SE), 18 Apr 2019 - 16 Mar 2023
  gedi_l4b_mu: "AGB/GEDI_L4B_Gridded_Biomass_V2/GEDI04_B_MW019MW223_02_002_02_R01000M_MU.tif"
  gedi_l4b_se: "AGB/GEDI_L4B_Gridded_Biomass_V2/GEDI04_B_MW019MW223_02_002_02_R01000M_SE.tif"
  # ESA CCI Biomass v6.0, 100 m (layers agb, agb_sd); 2020 = main analysis, 2021 = period sensitivity
  cci_2020: "AGB/ESA_CCI/ESACCI-BIOMASS-L4-AGB-MERGED-100m-2020-fv6.0.nc"
  cci_2021: "AGB/ESA_CCI/ESACCI-BIOMASS-L4-AGB-MERGED-100m-2021-fv6.0.nc"

  # --- predictors (stage 03) ---
  # ASTER GDEM v3 1-degree tiles (ASTGTMV003_<tile>_dem.tif): elevation, slope, northness
  aster_gdem_dir: "terrain/dem_usa"
  # TreeMap 2020 (Houtman et al., 2025; RDS-2025-0031): imputed FIA plot raster (with attribute table),
  # stand height (feet) and stand density index
  treemap_2020: "AGB/tree_map/TreeMap2020_CONUS.tif"
  treemap_standht: "stand_structure/forest_height_USDA/TreeMap2020_CONUS_STANDHT.tif"
  treemap_sdi: "stand_structure/SDI_USDA/TreeMap2020_CONUS_SDIsum.tif"
  # Community wood density map (Mo et al., 2024)
  wood_density: "stand_structure/Community_Wood_Density_Map_Merged.tif"
  # GEDI L4C gridded Waveform Structural Complexity Index, 1 km (layer 1 = mean WSCI estimate)
  gedi_l4c_wsci: "stand_structure/GEDI_L4C_WSCI_Gridded_2470/GEDI_L4C_WSCI_gridded_1km_20190418_20230317_V2.tif"
  # gNATSGO available water capacity (mm/m), CONUS
  gnatsgo_awc: "soil/awc_gNATSGO/awc_gNATSGO_US.tif"
  # SMAP enhanced L3 soil moisture (SPL3SMP_E v6), 2021 annual mean, CONUS lon/lat grid. Built from the daily
  # files, not downloaded as is: see README, "Building the soil-moisture input"
  smap_sm_2021: "../input_ok/SMAP_SM_2021mean.tif"
  # Pan et al. (2015) forest stand age map, 2011, 250 m (sensitivity: forest age not from TreeMap)
  pan_forest_age_2011: "stand_structure/forest_age_usda/conus_age11_250m.img"
  # layers not built from FIA plots (sensitivity, Table S2)
  glad_canopy_height_2019: "stand_structure/forest_height_2019/Forest_height_2019_NAM.tif"
  gami_forest_age: "stand_structure/forest_age_global/Forest_age.nc"
  crowther_tree_density: "stand_structure/tree_density_Crowther2015/Crowther_Nature_Files_Revision_01_WGS84_GeoTiff/Crowther_Nature_Biome_Revision_01_WGS84_GeoTiff.tif"
  # Hansen Global Forest Change v1.12 loss year, 10-degree tiles (forest loss 2019-2023, Section 2.3)
  hansen_lossyear_dir: "LULCC/lossyearglobal_title"

settings:
  seed: 42
  conus_bbox: [-125, -66, 24, 50]          # lon_min, lon_max, lat_min, lat_max for FIA plots
  conus_extent: [-125, -66.5, 24, 49]      # extent used to crop the tribal-land boundaries
  min_tribal_land_area_m2: 100000000       # tribal lands larger than 100 km² (TIGER/Line ALAND); write digits, YAML reads 1.0e8 as text
  selection_plot_years: [2019, 2023]       # forested FIA plots counted for the hexagon selection
  min_plots: 4                             # at least four forested FIA plots per hexagon
  min_overlap_fraction: 0.1666667          # overlap > 1/6 of the largest hexagon-tribal-land piece (~108 km²)
  min_forest_area_m2: 90000                # >= 9 ha NLCD 2021 forest in the piece (never binds; kept as a safety filter)
  min_hexagons_per_tribal_land: 6
  reference_years: [2018, 2022]            # FIA plots used for the reference AGB (main analysis)
  forest_canopy_threshold: 10              # forest = canopy cover > 10% (NLCD cells and FIA conditions)
  canopy_group_gap: 3                      # FIA canopy-cover values closer than 3 points share an interval
  workers: 16                              # parallel workers for the per-piece raster work
  treemap_age_year: 2020                   # TreeMap stand age is moved from the plot visit to this year
  glad_tree_height: [5, 60]                # GLAD canopy height: tree pixels are 5-60 m
  # Study regions: lon/lat boxes [lon_min, lon_max, lat_min, lat_max]. A hexagon belongs to the box that
  # holds its centroid; a hexagon outside every box takes the region of the other hexagons of its tribal land.
  regions:
    PNW:  [-122, -118, 44.5, 48.5]         # Pacific Northwest
    SW:   [-113, -106, 32.5, 41]           # Southwest / Four Corners
    SGP:  [-100, -94, 33.5, 37.1]          # Southern Great Plains
    NM:   [-97, -93, 46.5, 48.5]           # Northern Minnesota
    SECP: [-86.5, -78.1, 30.8, 35.2]       # Southeastern Coastal Plain
  # regions merged for the regional models (the two small regions join the most similar large one)
  merged_regions: {SGP: SGP, SW: SW, PNW: SW, NM: NM, SECP: NM}
